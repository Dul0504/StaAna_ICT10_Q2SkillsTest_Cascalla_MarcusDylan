<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <title>Skills Test - 2nd Quarter</title>

    <style>
        /* brown color palette, just change these if you want other shades */
        :root {
            --espresso: #3e2723;
            --coffee: #6d4c41;
            --latte: #a1887f;
            --cream: #f5ebe0;
            --mocha: #8d6e63;
        }

        /* page background */
        body {
            background: linear-gradient(135deg, var(--espresso), var(--mocha));
            min-height: 100vh;
        }

        /* main card */
        .card {
            border: none;
            border-radius: 20px;
            background: var(--cream);
        }

        .card-header {
            border-radius: 20px 20px 0 0 !important;
            background: var(--coffee);
            color: var(--cream);
        }

        /* instructions box */
        .info-box {
            background: #ead9c6;
            border: 1px solid var(--latte);
            color: var(--espresso);
        }

        /* text input */
        .form-control:focus {
            border-color: var(--coffee);
            box-shadow: 0 0 0 0.25rem rgba(109, 76, 65, 0.25);
        }

        /* button */
        .btn-brown {
            background: var(--coffee);
            border-color: var(--coffee);
            color: var(--cream);
        }

        .btn-brown:hover {
            background: var(--espresso);
            border-color: var(--espresso);
            color: var(--cream);
        }

        .label-brown,
        .title-brown {
            color: var(--espresso);
        }

        /* result box */
        #result {
            min-height: 120px;
            font-size: 1.05rem;
            background: #fffaf3;
            color: var(--espresso);
            border-left: 6px solid var(--coffee);
        }

        .card-footer {
            background: #ead9c6;
            border-radius: 0 0 20px 20px !important;
        }

        .footer-text {
            font-size: 0.9rem;
            color: var(--coffee);
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow-lg">

                <div class="card-header text-center p-4">

                    <h2>
                        <i class="bi bi-flask-fill"></i>
                        Non-Metal Elements
                    </h2>

                    <p class="mb-0">
                        Periodic Table Information Finder
                    </p>

                </div>

                <div class="card-body p-4">

                    <div class="info-box alert">
                        <strong>Instructions:</strong><br>
                        Enter the <b>symbol</b> of a non-metal element
                        (Example: H, O, Cl, Ne, Xe).
                    </div>

                    <form>

                        <div class="mb-3">

                            <label class="label-brown form-label fw-bold">
                                <i class="bi bi-search"></i>
                                Element Symbol
                            </label>

                            <input
                                type="text"
                                id="element_name"
                                class="form-control form-control-lg"
                                placeholder="Enter the symbol here">

                        </div>

                        <div class="d-grid">

                            <input
                                type="button"
                                py-click="element_checker"
                                value="Check Details"
                                class="btn btn-brown btn-lg">

                        </div>

                    </form>

                    <hr>

                    <h5 class="title-brown">
                        <i class="bi bi-card-list"></i>
                        Result
                    </h5>

                    <div id="result" class="rounded p-3 shadow-sm">

                    </div>

                </div>

                <div class="card-footer text-center footer-text">

                    <i class="bi bi-lightbulb-fill"></i>
                    Skills Test • 2nd Quarter • Undercovered

                </div>

            </div>

        </div>

    </div>

</div>

<py-script src="main.py"></py-script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
